        }
    </style>
    <rect class="bg" width="64" height="64" rx="12"/>
    <text class="h" x="11" y="48" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="44" font-weight="600">h</text>
    <rect class="cursor" x="40" y="20" width="8" height="28"/>
</svg>
